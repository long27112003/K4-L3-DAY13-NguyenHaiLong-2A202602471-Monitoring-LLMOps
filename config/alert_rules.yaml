alerts:
  - name: high_user_visible_latency
    severity: critical
    condition: "latency_p95_ms > 3000"
    duration: 10m
    type: symptom-based
    channel: "slack:#llmops-alerts"
    owner: llm-platform
    runbook: docs/alerts.md#alert-1
  - name: elevated_request_error_rate
    severity: critical
    condition: "error_rate_pct > 2"
    duration: 5m
    type: symptom-based
    channel: "slack:#llmops-alerts"
    owner: api-oncall
    runbook: docs/alerts.md#alert-2
  - name: degraded_answer_quality
    severity: warning
    condition: "quality_score_avg < 0.75 or retrieval_success_rate_pct < 90"
    duration: 15m
    type: symptom-based
    channel: "slack:#llmops-alerts"
    owner: ai-quality
    runbook: docs/alerts.md#alert-3
